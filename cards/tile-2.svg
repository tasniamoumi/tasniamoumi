<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="290" height="96" viewBox="0 0 290 96" role="img" aria-labelledby="t">
<title id="t">Email: say hello</title>
<style>@font-face{font-family:'Inter';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Inter';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}.up{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}.fade{opacity:0;animation:fade .6s ease forwards}.grow{transform:scaleY(0);transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.7,.2,1) forwards}.pop{transform:scale(.6);opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s cubic-bezier(.2,.7,.2,1) forwards}.breathe{animation:breathe 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.up,.fade,.grow,.pop{opacity:1!important;transform:none!important}.smil-o{opacity:1!important}.smil-d{stroke-dashoffset:0!important}}text{font-family:'Inter',system-ui,sans-serif;fill:#EEF0F6}.serif{font-family:'Instrument Serif',Georgia,serif}.mut{fill:#8A92A6}.sb{font-weight:600}.num{font-variant-numeric:tabular-nums}</style>
<rect width="290" height="96" rx="18" fill="#11141B" stroke="#232838"/>
<g class="up" style="animation-delay:1.28s"><rect x="20" y="24" width="48" height="48" rx="12" fill="#161A23" stroke="#232838"/><text x="44" y="56" text-anchor="middle" font-size="20" class="sb" fill="#FFB454">@</text><text x="84" y="46" font-size="16" class="sb">Email</text><text x="84" y="68" font-size="13" class="mut">say hello</text><text class="breathe" x="264" y="56" text-anchor="end" font-size="18" fill="#FFB454">→</text></g>
</svg>
